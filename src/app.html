<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peekit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-window: rgba(15, 17, 23, 0.88);
        --bg-card: rgba(22, 25, 34, 0.75);
        --bg-subtle: rgba(30, 34, 48, 0.6);
        --bg-hover: rgba(255, 255, 255, 0.08);
        --bg-active: rgba(255, 255, 255, 0.12);
        --border-color: rgba(255, 255, 255, 0.09);
        --border-hover: rgba(255, 255, 255, 0.18);
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-glow: rgba(59, 130, 246, 0.35);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-dim: #64748b;
        --shadow-elevation: 0 12px 32px -4px rgba(0, 0, 0, 0.45);
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-full: 9999px;
      }

      :root[data-theme="light"] {
        --bg-window: rgba(248, 250, 252, 0.92);
        --bg-card: rgba(255, 255, 255, 0.85);
        --bg-subtle: rgba(241, 245, 249, 0.8);
        --bg-hover: rgba(0, 0, 0, 0.05);
        --bg-active: rgba(0, 0, 0, 0.09);
        --border-color: rgba(0, 0, 0, 0.08);
        --border-hover: rgba(0, 0, 0, 0.15);
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --accent-glow: rgba(37, 99, 235, 0.25);
        --text-main: #0f172a;
        --text-muted: #475569;
        --text-dim: #94a3b8;
        --shadow-elevation: 0 12px 32px -4px rgba(0, 0, 0, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: transparent;
        color: var(--text-main);
        overflow: hidden;
        user-select: none;
        height: 100vh;
        width: 100vw;
      }

      pre, code {
        font-family: 'JetBrains Mono', Consolas, monospace;
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.25);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.45);
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
